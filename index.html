<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Toko Pancing - Daftar Barang</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f8ff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #006400; }
    .produk { display: flex; flex-wrap: wrap; justify-content: center; }
    .item { border: 1px solid #ccc; border-radius: 8px; margin: 10px; padding: 10px; width: 200px; text-align: center; background: #fff; }
    .item img { width: 100%; height: auto; border-radius: 5px; }
    .item button { margin-top: 10px; padding: 8px; background: #006400; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .item button:hover { background: #228B22; }
    .keranjang-link { display: block; text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>🎣 Toko Pancing</h1>
  <div class="produk">
    <div class="item">
      <img src="joran.jpg" alt="Joran Pancing">
      <h3>Joran Pancing</h3>
      <button>Tambah ke Keranjang</button>
    </div>
    <div class="item">
      <img src="reel.jpg" alt="Reel Pancing">
      <h3>Reel Pancing</h3>
      <button>Tambah ke Keranjang</button>
    </div>
    <div class="item">
      <img src="umpan.jpg" alt="Umpan Ikan">
      <h3>Umpan Ikan</h3>
      <button>Tambah ke Keranjang</button>
    </div>
  </div>
  <a class="keranjang-link" href="keranjang.html">Lihat Keranjang 🛒</a>
</body>
</html>
