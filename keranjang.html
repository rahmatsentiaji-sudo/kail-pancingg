<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Keranjang Belanja</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fffacd; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #ff8c00; }
    .keranjang { max-width: 600px; margin: auto; background: #fff8dc; border: 2px solid #ffd700; border-radius: 10px; padding: 20px; }
    .item { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .item span { font-weight: bold; }
    .checkout { text-align: center; margin-top: 20px; }
    .checkout button { padding: 10px 20px; background: #ffd700; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    .checkout button:hover { background: #ffa500; }
  </style>
</head>
<body>
  <h1>🛒 Keranjang Belanja</h1>
  <div class="keranjang">
    <div class="item"><span>Joran Pancing</span> <span>Rp 200.000</span></div>
    <div class="item"><span>Reel Pancing</span> <span>Rp 150.000</span></div>
    <div class="item"><span>Umpan Ikan</span> <span>Rp 50.000</span></div>
    <hr>
    <div class="item"><span>Total</span> <span>Rp 400.000</span></div>
    <div class="checkout">
      <button>Checkout Sekarang</button>
    </div>
  </div>
</body>
</html>
